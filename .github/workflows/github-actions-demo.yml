name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest streamlit pylint

      - name: Run Pylint
        run: |
          pylint *.py \
            --disable=C0114,C0116,C0303,C0304,C0305

      - name: Run tests
        run: |
          pytest _test.py